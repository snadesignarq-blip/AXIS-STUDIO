    header {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background-image: url("https://images.unsplash.com/photo-1503387762-592deb58ef4e");

    header h1,
header p,

    }

      font-size: 18px;

    .btn {
