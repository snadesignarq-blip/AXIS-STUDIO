<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXIS STUDIO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    /* HERO */
    header {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;

      background-image: url("https://images.unsplash.com/photo-1503387762-592deb58ef4e");
      background-size: cover;
      background-position: center;
      position: relative;
    }

    header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    }

    header h1,
    header p,
    header a {
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 60px;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
    }

    /* BOTONES */
    .btn {
      margin-top: 20px;
      padding: 12px 24px;
      border: 1px solid white;
      background: transparent;
      color: white;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: 0.3s;
    }

    .btn:hover {
      background: white;
      color: black;
    }

    /* SECCIONES */
    section {
      padding: 80px 20px;
      max-width: 1000px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 40px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    /* CONTACTO */
    .contacto {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      text-align: center;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      h1 {
        font-size: 40px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <header>
    <h1>AXIS STUDIO</h1>
    <p>Arquitectura | Diseño | Visualización 3D</p>

    <a class="btn" href="#proyectos">Ver Proyectos</a>

    <a class="btn" href="https://wa.me/5213781130824?text=Hola%20quiero%20una%20cotización%20de%20AXIS%20STUDIO" target="_blank">
      Cotización por WhatsApp
    </a>
  </header>

  <!-- SERVICIOS -->
  <section>
    <h2>Servicios</h2>

    <div class="grid">
      <div class="card">Arquitectura</div>
      <div class="card">Render 3D</div>
      <div class="card">Diseño Interior</div>
    </div>
  </section>

  <!-- PROYECTOS -->
  <section id="proyectos">
    <h2>Proyectos</h2>

    <div class="grid">
      <div class="card">Proyecto 1</div>
      <div class="card">Proyecto 2</div>
      <div class="card">Proyecto 3</div>
    </div>
  </section>

  <!-- CONTACTO -->
  <section>
    <h2>Contacto</h2>

    <div class="contacto">

      <a class="btn" href="https://wa.me/5213781130824?text=Hola%20quiero%20una%20cotización%20de%20AXIS%20STUDIO" target="_blank">
        WhatsApp: Cotización
      </a>

      <a class="btn" href="https://instagram.com/AXIS_STUDIO_ARQ" target="_blank">
        Instagram: @AXIS_STUDIO_ARQ
      </a>

      <a class="btn" href="mailto:SNADESIGNARQ@GMAIL.COM">
        Email: SNADESIGNARQ@GMAIL.COM
      </a>

    </div>
  </section>

</body>
</html>
